name: Update Lotto history

on:
  schedule:
    # Every Saturday at 14:00 UTC (23:00 Korea Standard Time), after the draw.
    - cron: "0 14 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest drawing history
        run: python update_history.py
      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-history.json
          git diff --cached --quiet || git commit -m "chore: update Lotto history"
          git push
