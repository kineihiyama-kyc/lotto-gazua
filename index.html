<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lotto Gazua · 미당첨 조합 생성기</title>
  <style>
    :root{--ink:#19352a;--muted:#6a7d73;--line:#dce8df;--paper:#fffefb;--green:#187155;--green-dark:#10513d;--soft:#e8f3ec;--bg:#f3f7f3;--danger:#b6423d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#e1f2e8 0,transparent 30rem),var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif}main{max-width:880px;margin:auto;padding:58px 22px 76px}.eyebrow{font-size:12px;letter-spacing:1.6px;color:var(--green);font-weight:800}.hero{margin-bottom:30px}h1{font-size:clamp(34px,6vw,52px);letter-spacing:-3px;line-height:1.13;margin:11px 0 13px;overflow-wrap:anywhere}p{color:var(--muted);line-height:1.75}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 16px 35px #1d51320d}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.field{display:grid;gap:8px;flex:1;min-width:150px}label{font-size:13px;font-weight:800}select,button{font:inherit}select{border:1px solid #bdd3c4;border-radius:11px;background:white;padding:12px;color:var(--ink);min-height:47px}button{border:0;border-radius:11px;padding:13px 18px;min-height:47px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;transition:transform .15s,background .15s}button:hover{background:var(--green-dark);transform:translateY(-1px)}button:disabled{opacity:.48;cursor:not-allowed;transform:none}.secondary{background:var(--soft);color:#245941}.secondary:hover{background:#d8eadc}.status{font-size:13px;min-height:23px;margin:18px 0 0}.status.error{color:var(--danger);font-weight:700}.result-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}.results{margin-top:18px;display:grid;gap:10px}.empty{padding:22px;border:1px dashed #c8d9cd;border-radius:15px;color:var(--muted);font-size:14px;text-align:center}.ticket{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;animation:appear .28s ease both}.ticket-label{width:23px;font-size:13px;color:var(--muted);font-weight:900}.balls{display:flex;gap:8px;flex-wrap:wrap}.ball{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:900;color:#263328}.num-red{background:#f18477}.num-yellow{background:#f4d669}.num-green{background:#79bd85}.num-blue{background:#7ba9d4}.num-purple{background:#ad8bc8}.ticket:nth-child(2){animation-delay:.05s}.ticket:nth-child(3){animation-delay:.1s}.ticket:nth-child(4){animation-delay:.15s}.ticket:nth-child(5){animation-delay:.2s}.frequency-panel{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:#f8fbf8;padding:15px}.frequency-panel h2{font-size:14px;margin:0;color:var(--ink)}.frequency-panel p{margin:4px 0 12px;font-size:11px;line-height:1.45}.frequency-list{display:grid;grid-template-rows:repeat(23,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px 10px;padding:0;margin:0;list-style:none}.frequency-row{display:grid;grid-template-columns:25px minmax(0,1fr);gap:6px;align-items:center;font-size:11px;min-width:0}.frequency-number{font-weight:900;color:var(--ink);text-align:right}.frequency-track{height:13px;border-radius:99px;background:#e1ece3;overflow:hidden}.frequency-bar{display:flex;height:100%;min-width:31px;padding:0 4px;align-items:center;justify-content:flex-end;border-radius:inherit;background:linear-gradient(90deg,#7fbe8b,#207357);color:#fff;font-size:9px;font-weight:900;font-variant-numeric:tabular-nums}.result-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.result-actions[hidden]{display:none}.result-actions button{min-height:38px;padding:8px 12px;font-size:13px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:23px}.stat{flex:1;min-width:200px;padding:14px 16px;border-radius:14px;background:#f0f6f0;font-size:13px;color:var(--muted)}.stat strong{color:var(--ink);font-size:16px}.notice{font-size:12px;margin:23px 0 0}.source{color:var(--green)}.updated{font-size:12px;color:var(--muted);margin:9px 0 0}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:680px){main{padding:38px 16px}.card{padding:20px}h1{letter-spacing:-2px}.controls>*{flex:0 0 100%;width:100%}.result-layout{grid-template-columns:1fr}.frequency-panel{margin-top:0}.ticket{align-items:flex-start}.ball{width:35px;height:35px}.result-actions button{width:auto}.stat{min-width:100%}}
    .frequency-bar{background:var(--bar-color,#207357);color:var(--bar-text,#fff)}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="eyebrow">🍀 LOTTO 6/45 · NO PREVIOUS JACKPOT</div>
      <h1>이번엔, 아직 안 나온 조합으로.</h1>
      <p>게임 수를 선택한 뒤 당첨 이력을 갱신하고, 번호 생성하기를 눌러주세요.</p>
    </section>
    <section class="card" aria-label="번호 생성기">
      <div class="controls">
        <div class="field"><label for="count">게임 수</label><select id="count"><option value="1">1게임</option><option value="2">2게임</option><option value="3" selected>3게임</option><option value="4">4게임</option><option value="5">5게임</option></select></div>
        <button class="secondary" id="sync" type="button">당첨 이력 갱신</button>
        <button id="generate" type="button" disabled>번호 생성하기</button>
      </div>
      <p id="status" class="status" role="status">당첨 이력을 준비하는 중…</p>
      <p id="updated" class="updated"></p>
      <div class="result-layout">
        <div><div id="results" class="results" aria-live="polite"><div class="empty">이력을 확인하면 번호를 생성할 수 있어요.</div></div><div id="result-actions" class="result-actions" hidden><button class="secondary" id="copy" type="button">번호 복사</button><button class="secondary" id="again" type="button">다시 뽑기</button></div></div>
        <aside class="frequency-panel" aria-labelledby="frequency-title"><h2 id="frequency-title">번호별 1등 출현 횟수</h2><ol id="frequency-list" class="frequency-list" aria-label="번호별 1등 출현 횟수 가로 막대 차트"></ol></aside>
      </div>
      <div class="summary"><div class="stat">확인한 1등 조합 <strong id="history-count">0개</strong> · 중복 조합 <strong id="duplicate-count">0개</strong></div><div class="stat">전체 가능한 조합 <strong>8,145,060개</strong></div></div>
      <p class="notice">과거 1등 조합과 중복되지 않도록만 처리합니다. 데이터 출처: <a class="source" href="https://www.dhlottery.co.kr/gameResult.do?method=byWin" target="_blank" rel="noreferrer">동행복권 로또6/45 당첨번호</a>.</p>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let winners=new Set(),poll,lastTickets=[];
    const key=values=>values.join(',');
    function randomTicket(){const pool=Array.from({length:45},(_,i)=>i+1);for(let i=pool.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,6).sort((a,b)=>a-b)}
    function ballClass(n){return n<=9?'num-red':n<=19?'num-yellow':n<=29?'num-green':n<=39?'num-blue':'num-purple'}
    function renderTickets(tickets){$('results').replaceChildren(...tickets.map((ticket,index)=>{const row=document.createElement('div');row.className='ticket';row.innerHTML='<span class="ticket-label">'+String.fromCharCode(65+index)+'</span><div class="balls">'+ticket.map(n=>'<span class="ball '+ballClass(n)+'">'+n+'</span>').join('')+'</div>';return row}));$('result-actions').hidden=!tickets.length}
    function renderFrequencyBars(history){const counts=Array(46).fill(0);history.forEach(draw=>draw.numbers.forEach(number=>counts[number]++));const data=Array.from({length:45},(_,i)=>({number:i+1,count:counts[i+1]})),max=Math.max(...counts,1),min=Math.min(...data.map(item=>item.count)),range=max-min||1;$('frequency-list').replaceChildren(...data.map(item=>{const row=document.createElement('li'),ratio=item.count/max,normalized=(item.count-min)/range,hue=Math.round(4+normalized*142);row.className='frequency-row';row.setAttribute('aria-label',item.number+'번 '+item.count+'회');row.innerHTML='<span class="frequency-number">'+item.number+'번</span><span class="frequency-track"><span class="frequency-bar" style="width:'+(ratio*100).toFixed(1)+'%;--bar-color:hsl('+hue+' 62% 43%);--bar-text:#fff">'+item.count+'</span></span>';return row}))}
    function generate(){const wanted=Number($('count').value),tickets=[],seen=new Set();while(tickets.length<wanted){const ticket=randomTicket(),id=key(ticket);if(!winners.has(id)&&!seen.has(id)){tickets.push(ticket);seen.add(id)}}lastTickets=tickets;renderTickets(tickets);$('status').textContent='새 조합을 만들었어요. 행운을 빌어요!';$('status').className='status'}
    async function load(refresh=false){try{const response=await fetch('lotto-history.json'+(refresh?'?v='+Date.now():''),{cache:'no-store'});if(!response.ok)throw Error();const history=await response.json();winners=new Set(history.map(item=>key(item.numbers)));renderFrequencyBars(history);const total=history.length,duplicates=total-winners.size;$('history-count').textContent=total.toLocaleString('ko-KR')+'개';$('duplicate-count').textContent=duplicates.toLocaleString('ko-KR')+'개';$('generate').disabled=winners.size===0;$('status').textContent='';$('status').className='status';const newest=history.at(-1);$('updated').textContent=newest?'최근 반영 회차: '+newest.round+'회 ('+newest.date+')':''}catch{$('status').textContent='당첨 이력을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';$('status').className='status error';$('generate').disabled=true}}
    $('generate').onclick=generate;$('again').onclick=generate;$('copy').onclick=async()=>{const text=lastTickets.map((ticket,i)=>String.fromCharCode(65+i)+'  '+ticket.join(', ')).join('\n');try{await navigator.clipboard.writeText(text);$('copy').textContent='복사됨!';setTimeout(()=>{$('copy').textContent='번호 복사'},1500)}catch{$('status').textContent='번호 복사에 실패했습니다. 직접 선택해 복사해 주세요.';$('status').className='status error'}};$('sync').onclick=async()=>{$('status').textContent='배포된 최신 이력을 불러오는 중…';$('status').className='status';$('generate').disabled=true;await load(true)};load();
    const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    async function synchronize(){
      const start=await fetch('/api/sync',{cache:'no-store'});
      if(!start.ok)throw Error();
      for(let attempt=0;attempt<25;attempt++){
        await wait(500);
        const response=await fetch('/api/history?'+Date.now(),{cache:'no-store'});
        if(!response.ok)throw Error();
        const payload=await response.json();
        if(!payload.sync.running){
          if(!payload.sync.message.includes('\ud655\uc778'))throw Error();
          return payload.sync.message;
        }
      }
      throw Error();
    }
    $('sync').onclick=async()=>{
      $('status').textContent='\ub2f9\ucc28 \uc774\ub825\uc744 \uc2e4\uc81c\ub85c \uac31\uc2e0\ud558\ub294 \uc911\u2026';
      $('status').className='status';
      $('generate').disabled=true;
      try{
        $('status').textContent=await synchronize();
      }catch{
        await load(true);
        $('status').textContent='\uacf5\uac1c \ud398\uc774\uc9c0\uc5d0\uc11c\ub294 \uc790\ub3d9 \uac31\uc2e0\ub41c \ucd5c\uc2e0 \uc774\ub825\uc744 \ubd88\ub7ec\uc654\uc5b4\uc694.';
      }
      $('status').className='status';
    };
  </script>
</body>
</html>
